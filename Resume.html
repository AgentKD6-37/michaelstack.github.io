<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Michael John Stack — Résumé</title>
    <meta name="description" content="The résumé of Michael John Stack, software engineer and Marine Corps veteran.">

    <link rel="icon" href="assets/crest-button.jpg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">

    <style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --ink: #0a0e1a;
    --ink-2: #131826;
    --navy-deep: #0f1a2e;
    --gold: #b8954f;
    --gold-bright: #d4b36a;
    --gold-dim: #8a6f3a;
    --ivory: #faf6ec;
    --ivory-dim: #d8d2c2;
    --muted: #948b7a;
    --serif-display: 'Cinzel', 'Trajan Pro', 'Times New Roman', serif;
    --serif-body: 'Cormorant Garamond', Garamond, 'Times New Roman', serif;
    --max-w: 1100px;
    --gutter: clamp(1.25rem, 4vw, 3rem);
    --section-y: clamp(4rem, 9vw, 7rem);
    --rule: 1px solid rgba(184, 149, 79, 0.35);
    --rule-strong: 1px solid rgba(184, 149, 79, 0.7);
    --shadow-deep: 0 20px 60px rgba(0, 0, 0, 0.55);
}

html { scroll-behavior: smooth; }
body { font-family: 'Cormorant Garamond', Garamond, 'Times New Roman', serif; font-size: 1.15rem; line-height: 1.7; color: #faf6ec; background: #0a0e1a; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
img { max-width: 100%; display: block; }
a { color: var(--gold-bright); text-decoration: none; transition: color 200ms ease; }
a:hover { color: var(--ivory); }
::selection { background: var(--gold); color: var(--ink); }

.eyebrow { font-family: var(--serif-display); font-size: 0.78rem; letter-spacing: 0.4em; text-transform: uppercase; color: var(--gold); font-weight: 500; }
.section-title { font-family: var(--serif-display); font-size: clamp(1.75rem, 3.5vw, 2.6rem); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ivory); font-weight: 500; margin-top: 0.5rem; }
.rule { display: flex; align-items: center; gap: 1rem; margin: 1.5rem auto 2.5rem; max-width: 240px; color: var(--gold); }
.rule::before, .rule::after { content: ''; flex: 1; height: 1px; background: linear-gradient(to right, transparent, var(--gold) 50%, transparent); }
.rule__diamond { width: 8px; height: 8px; background: var(--gold); transform: rotate(45deg); flex-shrink: 0; }
.section-header { text-align: center; margin-bottom: 3.5rem; }
.section-inner { max-width: var(--max-w); margin: 0 auto; }

.nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: rgba(10, 14, 26, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: var(--rule); }
.nav__inner { max-width: var(--max-w); margin: 0 auto; padding: 1rem var(--gutter); display: flex; align-items: center; justify-content: space-between; gap: 2rem; }
.nav__brand { display: flex; align-items: center; gap: 0.75rem; font-family: var(--serif-display); font-size: 0.95rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--ivory); }
.nav__brand-mark { width: 28px; height: 28px; object-fit: contain; mix-blend-mode: lighten; }
.footer__crest { mix-blend-mode: lighten; }
.nav__list { display: flex; gap: 2rem; list-style: none; }
.nav__list a { font-family: var(--serif-display); font-size: 0.78rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--ivory-dim); position: relative; padding: 0.25rem 0; }
.nav__list a:hover { color: var(--gold-bright); }
.nav__social { display: flex; gap: 1rem; align-items: center; }
.nav__social a { color: var(--ivory-dim); display: inline-flex; }
.nav__social a:hover { color: var(--gold-bright); }
.nav__toggle { display: none; background: none; border: var(--rule); color: var(--ivory); width: 42px; height: 42px; cursor: pointer; align-items: center; justify-content: center; }
.nav__toggle span, .nav__toggle span::before, .nav__toggle span::after { display: block; width: 18px; height: 1px; background: var(--gold); position: relative; }
.nav__toggle span::before, .nav__toggle span::after { content: ''; position: absolute; left: 0; }
.nav__toggle span::before { top: -6px; }
.nav__toggle span::after { top: 6px; }

@media (max-width: 820px) {
    .nav__toggle { display: inline-flex; margin-left: auto; }
    .nav__list, .nav__social { display: none; }
    .nav__inner > nav { display: contents; }
    .nav.is-open .nav__list { display: flex; flex-direction: column; gap: 1.25rem; position: absolute; top: 100%; left: 0; right: 0; background: var(--ink-2); padding: 2rem var(--gutter); border-bottom: var(--rule); }
}

.btn { display: inline-flex; align-items: center; gap: 0.65rem; padding: 0.9rem 2rem; border: 1px solid var(--gold); outline: 1px solid var(--gold); outline-offset: 3px; color: var(--ivory); font-family: var(--serif-display); font-size: 0.78rem; letter-spacing: 0.3em; text-transform: uppercase; transition: all 250ms ease; cursor: pointer; background: transparent; }
.btn:hover { background: var(--gold); color: var(--ink); }

.resume-wrap { padding: 8rem var(--gutter) var(--section-y); }
.resume-wrap .section-inner { max-width: 1000px; }
.resume__frame { border: 1px solid var(--gold-dim); padding: 12px; background: var(--ink-2); box-shadow: var(--shadow-deep); margin-top: 2rem; }
.resume__frame iframe { width: 100%; height: 85vh; border: 0; display: block; background: var(--ivory); }
.resume__download { text-align: center; margin-top: 2rem; }

.footer { padding: 4rem var(--gutter) 3rem; background: var(--navy-deep); border-top: var(--rule-strong); text-align: center; }
.footer__crest { width: 90px; margin: 0 auto 1.25rem; opacity: 0.85; }
.footer__motto { font-family: var(--serif-display); font-size: 0.95rem; letter-spacing: 0.4em; text-transform: uppercase; color: var(--gold); margin-bottom: 0.5rem; }
.footer__motto-sub { font-style: italic; color: var(--ivory-dim); font-size: 0.95rem; margin-bottom: 2rem; }
.footer__copy { font-size: 0.85rem; color: var(--muted); letter-spacing: 0.05em; }
    </style>
</head>

<body>

    <header class="nav" id="nav">
        <div class="nav__inner">
            <a href="index.html" class="nav__brand" aria-label="Michael John Stack — home">
                <img src="assets/crest-gold.png" alt="" class="nav__brand-mark" onerror="this.style.display='none'">
                <span>M.J. Stack</span>
            </a>

            <button class="nav__toggle" aria-label="Toggle navigation" aria-expanded="false" id="navToggle">
                <span></span>
            </button>

            <nav>
                <ul class="nav__list">
                    <li><a href="index.html#about">Biography</a></li>
                    <li><a href="index.html#services">Services</a></li>
                    <li><a href="index.html#work">Work</a></li>
                    <li><a href="Resume.html">Résumé</a></li>
                    <li><a href="index.html#contact">Inquiries</a></li>
                </ul>
            </nav>

            <div class="nav__social">
                <a href="https://github.com/AgentKD6-37" aria-label="GitHub" target="_blank" rel="noopener">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
                    </svg>
                </a>
                <a href="https://www.linkedin.com/in/michael-john-stack" aria-label="LinkedIn" target="_blank" rel="noopener">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M0 1.146C0 .513.526 0 1.175 0h13.65C15.474 0 16 .513 16 1.146v13.708c0 .633-.526 1.146-1.175 1.146H1.175C.526 16 0 15.487 0 14.854V1.146zm4.943 12.248V6.169H2.542v7.225h2.401zm-1.2-8.212c.837 0 1.358-.554 1.358-1.248-.015-.709-.52-1.248-1.342-1.248-.822 0-1.359.54-1.359 1.248 0 .694.521 1.248 1.327 1.248h.016zm4.908 8.212V9.359c0-.216.016-.432.08-.586.173-.431.568-.878 1.232-.878.869 0 1.216.662 1.216 1.634v3.865h2.401V9.25c0-2.22-1.184-3.252-2.764-3.252-1.274 0-1.845.7-2.165 1.193v.025h-.016a5.54 5.54 0 0 1 .016-.025V6.169h-2.4c.03.678 0 7.225 0 7.225h2.4z"/>
                    </svg>
                </a>
            </div>
        </div>
    </header>

    <main class="resume-wrap">
        <div class="section-inner">
            <div class="section-header">
                <span class="eyebrow">Curriculum Vitae</span>
                <h1 class="section-title">Résumé</h1>
                <div class="rule"><div class="rule__diamond"></div></div>
            </div>

            <div class="resume__frame">
                <iframe src="Michael_John_Stack_edited%20(3)%20(2).pdf" title="Michael John Stack résumé"></iframe>
            </div>

            <div class="resume__download">
                <a class="btn" href="Michael_John_Stack_edited%20(3)%20(2).pdf" download>Download PDF</a>
            </div>
        </div>
    </main>

    <footer class="footer">
        <img class="footer__crest" src="assets/crest-gold.png" alt="" onerror="this.style.display='none'">
        <div class="footer__motto">Virtute et Valor</div>
        <div class="footer__motto-sub">By Virtue and Valor</div>
        <div class="footer__copy">© <span id="year">2026</span> Michael John Stack · All rights reserved</div>
    </footer>

    <script>
        const nav = document.getElementById('nav');
        const toggle = document.getElementById('navToggle');
        if (toggle) {
            toggle.addEventListener('click', () => {
                const open = nav.classList.toggle('is-open');
                toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
            });
        }
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>

</html>
